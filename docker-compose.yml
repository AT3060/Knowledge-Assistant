# Step 14 - Two containers that work together: the API and the Qdrant vector database.
#
#   docker compose up -d --build     build (if needed) and start both in the background
#   docker compose ps                status of both containers
#   docker compose logs -f api       follow the API's log lines (Ctrl+C stops only the viewing)
#   docker compose down              stop and remove both containers (the volumes = data stay)
#
# Compose puts both containers into one private network. Inside it, each service is reachable
# under its SERVICE NAME: the API finds the database at http://qdrant:6333 - no IP addresses.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0          # pinned version: the same database on every machine
    ports:
      - "6333:6333"                       # only so YOU can open the dashboard: http://localhost:6333/dashboard
    volumes:
      - qdrant-data:/qdrant/storage       # vectors survive `docker compose down` and restarts
    restart: unless-stopped

  api:
    build: .                              # the Dockerfile from Step 13
    image: knowledge-copilot-api
    ports:
      - "8000:8000"
    environment:
      LLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      RERANKER: large
      QDRANT_URL: http://qdrant:6333      # "qdrant" = the service name above
      # HF_HUB_OFFLINE: "1"               # uncomment once the models are cached: start without internet
    volumes:
      - hf-cache:/cache/huggingface       # the model cache from Step 13 - no second download
    depends_on:
      - qdrant                            # start Qdrant first (the API still waits until it answers)
    restart: unless-stopped

volumes:
  qdrant-data:
  hf-cache:
    name: hf-cache                        # reuse the existing volume instead of creating a new, empty one
